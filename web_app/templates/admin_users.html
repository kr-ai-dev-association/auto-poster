<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 관리 - Auto Poster</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div x-data="adminApp()" class="container mx-auto p-8">
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center">
                <img src="/static/imgs/ai_profile.jpeg" alt="Logo" class="w-12 h-12 rounded-full object-cover mr-4 border-2 border-gray-300 shadow-md">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">👥 회원 관리</h1>
                    <p class="text-gray-500">사용 승인 및 권한 관리</p>
                </div>
            </div>
            <a href="/" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-bold hover:bg-gray-300 transition">홈으로 돌아가기</a>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider">이름</th>
                        <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider">이메일</th>
                        <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider">가입일</th>
                        <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider">상태</th>
                        <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider">권한</th>
                        <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider text-right">작업</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <template x-for="user in users" :key="user.id">
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900" x-text="user.name"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-gray-600" x-text="user.email"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-gray-500 text-sm" x-text="formatDate(user.created_at)"></td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span :class="user.is_active ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'" class="px-2.5 py-0.5 rounded-full text-xs font-bold" x-text="user.is_active ? '승인됨' : '승인 대기'"></span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span x-show="user.is_super_admin" class="bg-purple-100 text-purple-700 px-2.5 py-0.5 rounded-full text-xs font-bold">수퍼관리자</span>
                                <span x-show="!user.is_super_admin" class="text-gray-400 text-xs">-</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm">
                                <button x-show="!user.is_active" @click="approveUser(user.id)" class="text-indigo-600 font-bold hover:text-indigo-900 mr-3">승인</button>
                                <button x-show="!user.is_super_admin" @click="deleteUser(user.id)" class="text-red-600 font-bold hover:text-red-900">삭제</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
            
            <div x-show="users.length === 0" class="p-12 text-center text-gray-500">
                가입된 회원이 없습니다.
            </div>
        </div>
    </div>

    <script>
        function adminApp() {
            return {
                users: [],
                async init() {
                    const token = localStorage.getItem('access_token');
                    if (!token) {
                        window.location.href = '/login';
                        return;
                    }
                    this.fetchUsers();
                },
                async fetchUsers() {
                    const response = await fetch('/api/admin/users', {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                    });
                    if (response.ok) {
                        this.users = await response.json();
                    } else if (response.status === 401 || response.status === 403) {
                        alert('권한이 없거나 세션이 만료되었습니다.');
                        window.location.href = '/';
                    }
                },
                async approveUser(userId) {
                    if (!confirm('해당 사용자를 승인하시겠습니까?')) return;
                    
                    const response = await fetch(`/api/admin/users/${userId}/approve`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                    });
                    if (response.ok) {
                        this.fetchUsers();
                    }
                },
                async deleteUser(userId) {
                    if (!confirm('정말로 이 회원을 삭제하시겠습니까?')) return;
                    
                    const response = await fetch(`/api/admin/users/${userId}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                    });
                    if (response.ok) {
                        this.fetchUsers();
                    }
                },
                formatDate(dateStr) {
                    return new Date(dateStr).toLocaleDateString('ko-KR', {
                        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
                    });
                }
            }
        }
    </script>
</body>
</html>
