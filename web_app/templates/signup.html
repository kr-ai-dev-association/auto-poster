<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Auto Poster</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center py-12">
    <div x-data="signupForm()" class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-700">
        <div class="text-center mb-8">
            <div class="flex justify-center items-center mb-4">
                <img src="/static/imgs/ai_profile.jpeg" alt="Logo" class="w-16 h-16 rounded-full object-cover mr-3 border-2 border-indigo-600 shadow-lg">
                <h1 class="text-3xl font-bold text-white">Auto Poster</h1>
            </div>
            <p class="text-gray-400 mt-2">새로운 계정을 생성하세요</p>
        </div>

        <form @submit.prevent="submitSignup" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">이름</label>
                <input type="text" x-model="name" required class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 text-white rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none placeholder-gray-500" placeholder="홍길동">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">이메일 주소</label>
                <input type="email" x-model="email" required class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 text-white rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none placeholder-gray-500" placeholder="example@email.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">비밀번호</label>
                <input type="password" x-model="password" required class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 text-white rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none placeholder-gray-500" placeholder="••••••••">
                <p class="text-[10px] text-gray-500 mt-1">영문 대소문자, 숫자, 특수문자 조합 8자 이상</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">비밀번호 확인</label>
                <input type="password" x-model="passwordConfirm" required class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 text-white rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none placeholder-gray-500" placeholder="••••••••">
            </div>

            <div x-show="errorMessage" x-text="errorMessage" class="text-red-400 text-sm font-medium text-center" x-cloak></div>
            <div x-show="successMessage" x-text="successMessage" class="text-green-400 text-sm font-medium text-center" x-cloak></div>

            <button type="submit" :disabled="loading || successMessage" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition shadow-lg flex justify-center items-center disabled:bg-gray-600 disabled:cursor-not-allowed">
                <span x-show="!loading">회원가입 신청</span>
                <svg x-show="loading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-400">
            이미 계정이 있으신가요? <a href="/login" class="text-indigo-400 font-bold hover:text-indigo-300 hover:underline">로그인</a>
        </div>
    </div>

    <script>
        function signupForm() {
            return {
                name: '',
                email: '',
                password: '',
                passwordConfirm: '',
                loading: false,
                errorMessage: '',
                successMessage: '',
                async submitSignup() {
                    this.errorMessage = '';
                    
                    if (this.password !== this.passwordConfirm) {
                        this.errorMessage = '비밀번호가 일치하지 않습니다.';
                        return;
                    }

                    this.loading = true;
                    try {
                        const response = await fetch('/api/auth/signup', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: this.name,
                                email: this.email,
                                password: this.password
                            })
                        });
                        
                        const data = await response.json();
                        if (response.ok) {
                            this.successMessage = '회원가입 신청이 완료되었습니다. 관리자 승인 후 이용 가능합니다.';
                            setTimeout(() => { window.location.href = '/login'; }, 3000);
                        } else {
                            this.errorMessage = data.detail || '회원가입에 실패했습니다.';
                        }
                    } catch (error) {
                        this.errorMessage = '서버 연결 오류가 발생했습니다.';
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
